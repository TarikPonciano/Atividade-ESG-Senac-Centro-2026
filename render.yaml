services:
  - type: web
    name: sorteio-ods
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: CHAVE
        sync: false                                  # defina no painel do Render
      - key: URL_PUBLICA
        value: https://sorteio-ods.onrender.com      # o que o QR code vai codificar
      - key: NODE_VERSION
        value: "22"
